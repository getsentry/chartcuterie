minVersion: 3.9.0
github:
  owner: getsentry
  repo: chartcuterie

changelog:
  policy: auto
preReleaseCommand: bash scripts/bump-version.sh
versioning:
  policy: manual

statusProvider:
  name: github
artifactProvider:
  name: github

targets:
  - id: release
    name: docker
    source: us-docker.pkg.dev/sentryio/chartcuterie-mr/image
    target: getsentry/chartcuterie
  - id: latest
    name: docker
    source: us-docker.pkg.dev/sentryio/chartcuterie-mr/image
    target: getsentry/chartcuterie
    targetFormat: "{{{target}}}:latest"
  - name: npm
    access: public
  - name: github
