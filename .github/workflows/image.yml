name: Docker Image

on:
  pull_request:
  push:
    branches:
      - master
      - release/**
jobs:
  build-docker-image:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    name: build-docker-image-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build and push chartcuterie image
        uses: getsentry/action-build-and-push-images@dd9b907092cdd2dbc6c1a409f7290df1b391f6ee
        with:
          image_name: 'chartcuterie'
          platforms: linux/${{ matrix.platform }}
          dockerfile_path: './Dockerfile'
          ghcr: ${{ github.event_name != 'pull_request' }}
          tag_suffix: -${{ matrix.platform }}
          publish_on_pr: ${{ github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' }}
          google_ar: false
          tag_nightly: false
          tag_latest: false

  # Production image for GoCD deploys and craft releases. Publishes the same
  # <sha> tag to Google AR that the Cloud Build trigger used to, so the deploy
  # and release paths no longer depend on Cloud Build.
  build-production:
    runs-on: ubuntu-24.04
    name: Build and push production image
    if: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build and push production image to Google AR
        uses: getsentry/action-build-and-push-images@dd9b907092cdd2dbc6c1a409f7290df1b391f6ee
        with:
          image_name: 'chartcuterie'
          platforms: linux/amd64
          dockerfile_path: './Dockerfile'
          ghcr: false
          tag_nightly: false
          tag_latest: false
          google_ar: true
          google_ar_image_name: us-docker.pkg.dev/sentryio/chartcuterie-mr/image
          google_workload_identity_provider: projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool
          google_service_account: gha-chartcuterie-push@sac-prod-sa.iam.gserviceaccount.com

  assemble-chartcuterie-image:
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - run: docker login --username '${{ github.actor }}' --password-stdin ghcr.io <<< "$GHCR_TOKEN"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Create multiplatform manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/getsentry/chartcuterie:${{ github.event.pull_request.head.sha || github.sha }} \
            --tag ghcr.io/getsentry/chartcuterie:nightly \
            ghcr.io/getsentry/chartcuterie:${{ github.event.pull_request.head.sha || github.sha }}-amd64 \
            ghcr.io/getsentry/chartcuterie:${{ github.event.pull_request.head.sha || github.sha }}-arm64
